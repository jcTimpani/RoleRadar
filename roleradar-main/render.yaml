# Render Blueprint: one web service (FastAPI serves the API and the frontend).
# Database: an external MySQL-compatible service (TiDB Cloud Starter); its credentials go in
# the dashboard as environment variables, never in this file.
services:
  - type: web
    name: roleradar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DB_SSL
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_PORT
        value: "4000"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
