<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — RoleRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/public.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="pub">
<div class="auth-shell">
  <div class="auth-left">
   <div class="auth-left-inner">
    <div class="pub-logo" id="auth-logo" style="margin-bottom:32px;"></div>
    <div id="verify-state" class="auth-state">
      <div class="auth-icon" id="verify-icon"><i class="fas fa-spinner fa-spin"></i></div>
      <h1 style="font-size:var(--fs-xl);margin-bottom:8px;" id="verify-title">Verifying your email…</h1>
      <p style="color:var(--pub-text-secondary);margin-bottom:20px;" id="verify-text">One moment, please.</p>
      <a href="login.html" class="btn btn-primary btn-block" id="verify-login" style="display:none;">Continue to Log In</a>
    </div>
    <div id="resend-box" style="display:none;margin-top:24px;">
      <p class="auth-msg" id="resend-msg" role="status"></p>
      <form id="resend-form">
        <div class="field">
          <label for="resend-email">Get a new link</label>
          <input class="input" type="email" id="resend-email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-outline btn-block" id="resend-btn">Send a New Verification Link</button>
      </form>
    </div>
   </div>
  </div>

  <div class="auth-right">
    <h2>One Platform for a <span style="color:var(--accent-green)">Brighter</span> Tomorrow</h2>
    <div style="margin-top:24px;">
      <div class="auth-check"><i class="fas fa-circle-check"></i> Find real jobs</div>
      <div class="auth-check"><i class="fas fa-circle-check"></i> Get AI-powered insights</div>
      <div class="auth-check"><i class="fas fa-circle-check"></i> Improve your resume</div>
      <div class="auth-check"><i class="fas fa-circle-check"></i> Practice interviews</div>
    </div>
    <div class="auth-quote">"Opportunities don't happen. You find them."</div>
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/api.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  $('auth-logo').innerHTML = `<span class="rr-mark">${RR_LOGO_SVG}</span><span class="wordmark"><span class="wordmark-role">Role</span><span class="wordmark-radar">Radar</span></span>`;
  const token = new URLSearchParams(window.location.search).get('token') || '';
  function fail(message) {
    $('verify-icon').className = 'auth-icon bad'; $('verify-icon').innerHTML = '<i class="fas fa-circle-exclamation"></i>';
    $('verify-title').textContent = 'We could not verify your email';
    $('verify-text').textContent = message;
    $('resend-box').style.display = 'block';
  }
  (async () => {
    if (!token) { fail('This link is missing its token. Please use the link from your email, or request a new one below.'); return; }
    const res = await RoleRadarAPI.auth.verify(token);
    if (res.ok) {
      $('verify-icon').innerHTML = '<i class="fas fa-circle-check"></i>';
      $('verify-title').textContent = 'Email verified';
      $('verify-text').textContent = 'Your account is ready. Log in to start using RoleRadar.';
      $('verify-login').style.display = 'block';
      $('verify-login').href = 'login.html?verified=1';
      setTimeout(() => { window.location.href = 'login.html?verified=1'; }, 3500);
    } else fail(res.message);
  })();
  $('resend-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('resend-btn'); btn.disabled = true;
    const res = await RoleRadarAPI.auth.resend($('resend-email').value.trim());
    const el = $('resend-msg'); el.textContent = res.ok ? 'If that account still needs verifying, a new link is on its way.' : res.message;
    el.className = 'auth-msg show ' + (res.ok ? 'ok' : 'error');
    setTimeout(() => { btn.disabled = false; }, 60000);
  });
</script>
</body>
</html>
