<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile & Settings — RoleRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<script src="assets/js/store.js"></script>
<script src="assets/js/auth-gate.js"></script>
</head>
<body class="app" data-page="profile">
<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>
  <div>
    <header class="topbar" id="topbar-root"></header>
    <main class="main">
      <div class="page-header">
        <div>
          <h1>Profile & Settings</h1>
        </div>
      </div>

      <div class="profile-grid">
        <div class="card section-card">
          <div class="section-head"><h3>Profile Information</h3><button class="btn btn-outline btn-sm" id="edit-profile-btn">Edit Profile</button></div>
          <div class="flex items-center gap-3" style="margin-bottom:20px;">
            <div class="avatar lg" id="profile-avatar">RS</div>
            <div>
              <div style="font-weight:800;font-size:var(--fs-md);" id="profile-name-display">Rahul Singh</div>
              <div class="text-muted" id="profile-email-display">rahul.singh@unt.edu</div>
              <div class="text-muted" style="font-size:var(--fs-xs);">Student</div>
            </div>
          </div>
          <form id="profile-form">
            <div class="profile-field-row">
              <div class="field"><label>Full Name</label><input class="input" id="p-fullName" disabled></div>
              <div class="field"><label>Email</label><input class="input" id="p-email" disabled></div>
            </div>
            <div class="profile-field-row">
              <div class="field"><label>Location</label><input class="input" id="p-location" disabled></div>
              <div class="field"><label>Target Role</label><input class="input" id="p-targetRole" disabled></div>
            </div>
            <div class="field"><label>About</label><textarea class="input" id="p-about" rows="3" disabled></textarea></div>
            <button type="submit" class="btn btn-primary" id="save-profile-btn" style="display:none;">Save Changes</button>
          </form>
        </div>

        <div class="card section-card" id="settings">
          <h3>Settings</h3>
          <div class="settings-list">
            <div class="settings-item">
              <div class="flex items-center gap-3"><div class="s-icon"><i class="fas fa-palette"></i></div><div><div class="s-label">Theme</div></div></div>
              <div class="theme-toggle" id="theme-toggle">
                <button data-theme="light">Light</button>
                <button data-theme="system">System</button>
              </div>
            </div>
            <div class="settings-item" style="flex-direction:column;align-items:stretch;">
              <div class="flex items-center gap-3" style="margin-bottom:12px;"><div class="s-icon"><i class="fas fa-key"></i></div><div><div class="s-label">Change Password</div><div class="s-sub">Update the password you log in with</div></div></div>
              <p class="auth-msg" id="password-msg" role="alert"></p>
              <form id="password-form">
                <div class="field"><label for="p-current-password">Current password</label><input class="input" type="password" id="p-current-password" autocomplete="current-password" required></div>
                <div class="field"><label for="p-new-password">New password</label><input class="input" type="password" id="p-new-password" autocomplete="new-password" minlength="8" maxlength="128" required></div>
                <button type="submit" class="btn btn-outline btn-sm" id="password-btn">Update Password</button>
              </form>
            </div>
            <div class="settings-item danger">
              <div class="flex items-center gap-3"><div class="s-icon"><i class="fas fa-trash"></i></div><div><div class="s-label" style="color:var(--app-danger);">Delete Account</div><div class="s-sub">Permanently delete your account</div></div></div>
              <button class="btn btn-danger btn-sm" id="delete-account-btn">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="app-footer">RoleRadar — Your Skills. Our Radar. A Brighter Tomorrow.</footer>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/jobs-ui.js"></script>
<script src="assets/js/sidebar.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
